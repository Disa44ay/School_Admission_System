name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    name: docker compose up
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: API is healthy (and can reach PostgreSQL)
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/health

      - name: Frontend is served
        run: curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:5173

      - name: Backend tests (real PostgreSQL in compose)
        run: docker compose --profile test run --rm backend-tests

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
